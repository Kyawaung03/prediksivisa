        function getFormattedFileName(pasaranName) {
            const index = masterPasaranList.indexOf(pasaranName.trim().toUpperCase());
            const num = (index !== -1 ? index + 1 : 99).toString().padStart(2, '0');

        function drawText(ctx, text, s) {
            ctx.save();
            ctx.font = `${s.style || 'normal'} ${s.weight} ${s.size}px "${s.font}", serif`;
            ctx.textAlign = s.align;
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.lineJoin = 'round';
            ctx.miterLimit = 2;
            ctx.strokeStyle = '#000000';
            
            let tebalOutline = s.size * 0.05;
            if (tebalOutline > 8) tebalOutline = 8;
            if (tebalOutline < 2) tebalOutline = 2;
            ctx.lineWidth = tebalOutline;
            ctx.fillStyle = s.color;

            let ls = s.spacing || 0;

            if (ls > 0) {
                const words = text.split(' ');
                let totalWidth = 0;
                for (let w = 0; w < words.length; w++) {
                    const word = words[w];
                    for (let i = 0; i < word.length; i++) {
                        totalWidth += ctx.measureText(word[i]).width + ls;
                    }
                    totalWidth -= ls; 
                    if (w < words.length - 1) totalWidth += ctx.measureText(' ').width; 
                }

                let startX;
                if (s.align === 'center') startX = s.x - (totalWidth / 2);
                else if (s.align === 'right') startX = s.x - totalWidth;
                else startX = s.x;

                for (let w = 0; w < words.length; w++) {
                    const word = words[w];
                    for (let i = 0; i < word.length; i++) {
                        ctx.strokeText(word[i], startX, s.y);
                        ctx.fillText(word[i], startX, s.y);
                        startX += ctx.measureText(word[i]).width + ls;
                    }
                    if (w < words.length - 1) {
                        startX += ctx.measureText(' ').width;
                    }
                }
            } else {
                ctx.strokeText(text, s.x, s.y);
                ctx.fillText(text, s.x, s.y);
            }
            ctx.restore();
        }

        function generateBBFS() {
            let digits = [], attempts = 0;
            while (digits.length < 6 && attempts < 5000) {
                let num = Math.floor(Math.random() * 10);
                if (!digits.includes(num) && (digits.length === 0 || Math.abs(num - digits[digits.length-1]) !== 1)) {
                    digits.push(num); attempts = 0;
                } else attempts++;
            }
            return digits.length < 6 ? [0,2,4,6,8,1] : digits;
        }

        function cariShio(angka) {
            const n = angka.toString().padStart(2, '0');
            for (let s in tabelShio) if (tabelShio[s].includes(n)) return s;
            return "KELINCI";
        }

        function generatePrediksi() {
            const bbfs = generateBBFS();
            const d4B = `${bbfs[0]}${bbfs[1]}${bbfs[2]}${bbfs[3]}`;
            const d4T = `${bbfs[2]}${bbfs[4]}${bbfs[3]}${bbfs[5]}`;
            const d4A = `${bbfs[4]}${bbfs[5]}${bbfs[0]}${bbfs[1]}`;
            const d2KA = `${bbfs[3]}${bbfs[5]}`, d2KB = `${bbfs[2]}${bbfs[4]}`;
            const d2KA2 = `${bbfs[1]}${bbfs[2]}`, d2KB2 = `${bbfs[0]}${bbfs[3]}`;
            const d3B1 = `${bbfs[0]}${bbfs[1]}${bbfs[2]}`, d3B2 = `${bbfs[3]}${bbfs[4]}${bbfs[5]}`, d3B3 = `${bbfs[5]}${bbfs[2]}${bbfs[0]}`;
            const main = `${bbfs[5]}${bbfs[4]}${bbfs[0]}${bbfs[1]}`;
            const colok = `${bbfs[0]}/${bbfs[5]}`;
            return { bbfs: bbfs.join(''), angkaMain: main, colokBebas: colok, 
                     d4: {atas:d4A, tengah:d4T, bawah:d4B}, 
                     d2: {kiriAtas:d2KA, kiriBawah:d2KB, kananAtas:d2KA2, kananBawah:d2KB2},
                     d3: {baris1:d3B1, baris2:d3B2, baris3:d3B3}, 
                     shio: cariShio(bbfs[0]*10+bbfs[1]) };
        }

        function formatDateLocal(dateString) {
            const parts = dateString.split('-');
            const localDate = new Date(parts[0], parts[1] - 1, parts[2]); 
            const monthNames = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
            return `${localDate.getDate().toString().padStart(2,'0')} ${monthNames[localDate.getMonth()]} ${localDate.getFullYear()}`;
        }

        function renderToCanvas(prediksi, namaPasaran, tanggalStr, bgImage) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 720; canvas.height = 1080;
            
            if (bgImage) ctx.drawImage(bgImage, 0, 0, 720, 1080);
            else {
                const g = ctx.createLinearGradient(0,0,720,1080);
                g.addColorStop(0,'#1a1a2e'); g.addColorStop(1,'#16213e');
                ctx.fillStyle=g; ctx.fillRect(0,0,720,1080);
            }

            const tglFmt = formatDateLocal(tanggalStr);
            
            drawText(ctx, tglFmt, settings.tanggal);
            
            const formattedNamaPasaran = formatPasaranName(namaPasaran);
            drawText(ctx, formattedNamaPasaran, settings.namaPasaran); 
            
            drawText(ctx, prediksi.d2.kiriAtas, settings.d2_kiriAtas);
            drawText(ctx, prediksi.d2.kiriBawah, settings.d2_kiriBawah);
            drawText(ctx, prediksi.d2.kananAtas, settings.d2_kananAtas);
            drawText(ctx, prediksi.d2.kananBawah, settings.d2_kananBawah);
            
            drawText(ctx, prediksi.d3.baris1, settings.d3_baris1);
            drawText(ctx, prediksi.d3.baris2, settings.d3_baris2);
            drawText(ctx, prediksi.d3.baris3, settings.d3_baris3);
            
            drawText(ctx, prediksi.d4.atas, settings.d4_atas);
            drawText(ctx, prediksi.d4.tengah, settings.d4_tengah);
            drawText(ctx, prediksi.d4.bawah, settings.d4_bawah);
            
            const cParts = prediksi.colokBebas.split('/');
            drawText(ctx, cParts[0], settings.colok_angka1);
            drawText(ctx, '/', settings.colok_slash);
            drawText(ctx, cParts[1], settings.colok_angka2);
            
            drawText(ctx, prediksi.angkaMain, settings.angkaMain);
            drawText(ctx, prediksi.bbfs, settings.bbfs);
            
            const shioImg = shioImages[prediksi.shio];
            if (shioImg && shioImg.complete) {
                ctx.drawImage(shioImg, settings.shio.x, settings.shio.y, settings.shio.size, settings.shio.size);
            } else {
                ctx.save();
                ctx.font = `bold ${settings.shio.size * 0.4}px "Segoe UI"`;
                ctx.fillStyle = "#ffd42e";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(prediksi.shio, settings.shio.x + (settings.shio.size/2), settings.shio.y + (settings.shio.size/2));
                ctx.restore();
            }
            
            return canvas;
        }

        function showStatus(msg, type) { 
            const s = document.getElementById('status'); 
            s.textContent = msg; 
            s.className = `status ${type}`; 
        }

        async function loadShioImages() {
            await Promise.all(shioNames.map(s => new Promise(r => {
                const i = new Image(); 
                i.src = `shio/${s}.png`; 
                i.onload = () => { shioImages[s] = i; r(true); }; 
                i.onerror = () => r(false);
            })));
        }

        document.getElementById('bgTemplate').addEventListener('change', e => {
            const f = e.target.files[0]; if(!f) return;
            const i = new Image(); 
            i.onload = () => { currentBgImage = i; showStatus('✅ Background berhasil dimuat!', 'success'); }; 
            i.src = URL.createObjectURL(f);
        });

        function generateSingle() {
            const t = document.getElementById('tanggal').value;
            const n = document.getElementById('namaPasaran').value.trim();
            if(!t || !n || !currentBgImage) { showStatus('❌ Lengkapi tanggal, nama pasaran & upload BG!', 'error'); return; }
            
            const pred = generatePrediksi();
            const canvas = renderToCanvas(pred, n, t, currentBgImage);
            currentPreviewCanvas = canvas;
            
            const pc = document.getElementById('previewCanvas');
            pc.width = 720; pc.height = 1080;
            pc.getContext('2d').drawImage(canvas, 0, 0);
            
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('previewSection').classList.add('active');
            showStatus(`✅ Single Preview Ready | BBFS: ${pred.bbfs} | Shio: ${pred.shio}`, 'success');
        }

        function downloadPreview() {
            if(!currentPreviewCanvas) return;
            const a = document.createElement('a');
            const nama = document.getElementById('namaPasaran').value.trim().toUpperCase();
            
            // Nama file hanya nomor urut + nama pasaran (tanpa tanggal)
            a.download = getFormattedFileName(nama);
            a.href = currentPreviewCanvas.toDataURL('image/png'); 
            a.click();
        }

        async function generate(shift) {
            const t = document.getElementById('tanggal').value;
            if(!t || !currentBgImage) { showStatus('❌ Lengkapi tanggal & upload Background terlebih dahulu!', 'error'); return; }
            
            const list = shift === 'pagi' ? pasaranPagi : pasaranMalam;
            
            generatedImages = []; 
            document.getElementById('btnDownloadZip').style.display = 'none';
            
            document.getElementById('btnPagi').disabled = true;
            document.getElementById('btnMalam').disabled = true;
            
            showStatus(`⏳ Memproses ${list.length} pasaran ${shift}... (Jangan tutup tab)`, 'processing');
            
            for(let i = 0; i < list.length; i++) {
                const nama = list[i];
                const pred = generatePrediksi();
                const cv = renderToCanvas(pred, nama, t, currentBgImage);
                
                // Nama file hanya nomor urut + nama pasaran (tanpa tanggal)
                const fileName = getFormattedFileName(nama);
                
                const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
                generatedImages.push({ name: fileName, blob: blob });

                if (i === list.length - 1) {
                    currentPreviewCanvas = cv;
                    const pc = document.getElementById('previewCanvas');
                    pc.width = 720; pc.height = 1080;
                    pc.getContext('2d').drawImage(cv, 0, 0);
                    document.getElementById('previewSection').style.display = 'block';
                    document.getElementById('previewSection').classList.add('active');
                    showStatus(`✅ Selesai! ${list.length} gambar siap di-ZIP. Preview menampilkan: ${nama}`, 'success');
                    document.getElementById('btnDownloadZip').style.display = 'block';
                } else {
                    showStatus(`⏳ Memproses ${i + 1} / ${list.length}...`, 'processing');
                }
                
                await new Promise(r => setTimeout(r, 100));
            }
            
            document.getElementById('btnPagi').disabled = false;
            document.getElementById('btnMalam').disabled = false;
        }

        async function downloadAllAsZip() {
            if (generatedImages.length === 0) {
                showStatus('❌ Tidak ada data untuk di-zip!', 'error');
                return;
            }
            
            showStatus('⏳ Mengompres file ZIP... (Tunggu sebentar)', 'processing');
            document.getElementById('btnDownloadZip').disabled = true;
            
            const zip = new JSZip();
            generatedImages.forEach(item => {
                zip.file(item.name, item.blob);
            });
            
            try {
                const content = await zip.generateAsync({type: "blob"});
                const t = document.getElementById('tanggal').value;
                saveAs(content, `Petruk_Massal_${t}.zip`);
                showStatus('✅ File ZIP berhasil didownload!', 'success');
            } catch (err) {
                console.error(err);
                showStatus('❌ Gagal membuat ZIP (Kemungkinan kehabisan memori)', 'error');
            } finally {
                document.getElementById('btnDownloadZip').disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
            showStatus('⏳ Memuat data Shio...', 'processing');
            await loadShioImages();
            const loadedCount = Object.keys(shioImages).length;
            if (loadedCount === 12) {
                showStatus('✅ Sistem siap! Silakan upload Background Template.', 'success');
            } else {
                showStatus(`⚠️ Peringatan: Hanya ${loadedCount}/12 gambar shio ditemukan. Pastikan folder 'shio/' ada.`, 'error');
            }
        });
    </script>
